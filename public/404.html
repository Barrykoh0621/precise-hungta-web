<!DOCTYPE html>

    <title>Hung Ta Instrument</title>
    <meta name="robots" content="noindex, follow" />
    <script>
      (function () {
        var base = location.pathname.indexOf("/precise-hungta-web/") === 0 ? "/precise-hungta-web/" : "/";
        var path = location.pathname.replace(/^\/precise-hungta-web/, "") || "/";
        var target = base + "?redirect=" + encodeURIComponent(path + location.search + location.hash);
        location.replace(target);
      })();
    </script>
